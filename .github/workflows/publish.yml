name: publish
# Makes the public release from installers the private build already put in R2 (served by the
# Birrcode site at /dl/TAG/FILE), so nothing large is uploaded from a laptop.
# Run: gh workflow run publish -R RAMZA123-ux/birrcode-downloads -f tag=desktop-vX.Y.Z
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. desktop-v0.0.4
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download installers from the Birrcode site and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^desktop-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag $TAG"; exit 1; }
          v="${TAG#desktop-v}"
          mkdir assets
          for f in macos-arm64.dmg macos-x64.dmg windows-x64-setup.exe windows-x64-portable.exe; do
            curl -fL --retry 3 -o "assets/Birrcode-v$v-$f" "https://birrcode-web.ramza.workers.dev/dl/$TAG/Birrcode-v$v-$f"
          done
          ls -la assets
          gh release create "$TAG" --target main --title "Birrcode $v" --notes "Download from the Birrcode website." assets/*
